services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: policy_engine
      POSTGRES_PASSWORD: policy_engine
      POSTGRES_DB: policy_engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policy_engine"]
      interval: 5s
      timeout: 3s
      retries: 5

  cedar-agent:
    image: ghcr.io/cedar-policy/cedar-agent:latest
    environment:
      AUTHENTICATION_TOKEN: changeme
    ports:
      - "8180:8180"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8180/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgres://policy_engine:policy_engine@postgres:5432/policy_engine?sslmode=disable
      CEDAR_AGENT_URL: http://cedar-agent:8180
      CEDAR_AGENT_AUTH_TOKEN: changeme
      REST_LISTEN_ADDR: 0.0.0.0:8080
      GRPC_LISTEN_ADDR: 0.0.0.0:9090
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      cedar-agent:
        condition: service_healthy

volumes:
  pgdata:
